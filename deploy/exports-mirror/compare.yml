# EXPORTS MIRROR verdict (F2.5, ARCHITECT 2026-10-03): on every push, the
# laptop-vs-host comparison for the newest date BOTH writers have, posted as a
# commit status (context "compare_exports"): success = CLEAN (exit 0),
# failure = DIVERGENT (exit 1: a paired file differs, a pair does not parse,
# or a PAIRED KIND is missing on a side for a COMPLETE day, addendum 335 item
# 4(c) as 336 item 4(2) corrects it), error = the comparator/runner broke (any
# other exit, or no matching VERDICT line) — not a data verdict; pending =
# NOTHING-TO-COMPARE (exit 3: a paired kind awaiting the other side on the
# runner's own UTC day, 336 item 4(2): "the laptop's 12:2xZ commit reads
# pending, the host's 16:0xZ commit reads the pair"; or no paired kind
# compared with rows in the window, 335 item 4(c); never a clean verdict and
# never a failure) or the other side has not pushed that date yet. An
# unpaired kind on both sides is printed and counted, never a verdict (336
# item 4(3)). NOTHING-TO-COMPARE (ARCHITECT 2026-11-11, addendum 334 item 3(a)):
# "neutral, not failure"; a commit status has no neutral state (success,
# failure, error, pending), and pending is the one that is neither green nor
# red. Each writer's push ships its own copy of this file and the comparator,
# so a writer on an older tag puts the older mapping back on its own commits.
# tools/compare_exports.py is standalone (stdlib only). Shipped
# into Sports-Predictor-exports by exports_mirror.py push (do not edit there).
name: compare_exports
on:
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compare the newest common date
        id: cmp
        run: |
          set +e
          d=$(comm -12 <(ls laptop 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort) \
                       <(ls host 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort) | tail -1)
          if [ -z "$d" ]; then
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "desc=no date pushed by both laptop and host yet" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/compare_exports.py "laptop/$d" "host/$d" --since 0 | tee compare.txt
          rc=${PIPESTATUS[0]}
          v=$(grep -E '^VERDICT: ' compare.txt | tail -1)
          echo "date=$d" >> "$GITHUB_OUTPUT"
          # a data verdict needs BOTH the exit code and the comparator's own VERDICT line;
          # anything else (an import error, a crash before main, a runner fault) is an error
          if [ "$rc" = "0" ] && [ "$v" = "VERDICT: CLEAN" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"; echo "desc=CLEAN · $d" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "1" ] && [ "$v" = "VERDICT: DIVERGENT" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"; echo "desc=DIVERGENT · $d (see the run log)" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "3" ] && [ "${v#VERDICT: NOTHING-TO-COMPARE}" != "$v" ]; then
            n=$(grep -cE '^· ' compare.txt)
            w=$(printf '%s\n' "$v" | grep -oE 'awaiting (host|laptop)' | sed 's/^awaiting //' | sort -u | paste -sd' ' -)
            if [ -n "$w" ]; then
              echo "state=pending" >> "$GITHUB_OUTPUT"; echo "desc=NOTHING-TO-COMPARE · $d — awaiting $w: a paired kind not pushed yet today; neutral, not a data verdict" >> "$GITHUB_OUTPUT"
            else
              echo "state=pending" >> "$GITHUB_OUTPUT"; echo "desc=NOTHING-TO-COMPARE · $d — no paired kind compared with rows in the window, $n on one side only; neutral, not a data verdict" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state=error" >> "$GITHUB_OUTPUT"; echo "desc=comparator ERROR (exit $rc) · $d — not a data verdict" >> "$GITHUB_OUTPUT"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat compare.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: post the verdict as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="${{ steps.cmp.outputs.state }}" -f context="compare_exports" \
            -f description="${{ steps.cmp.outputs.desc }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
