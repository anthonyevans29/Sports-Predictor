<h3 class="px-4 py-3 border-b border-slate-200 font-semibold text-sm flex items-center justify-between">
  <span>⭐ My clubs</span>
  <span class="text-slate-400 text-xs font-normal">{{ pinned_clubs|length }}</span>
</h3>

{% if pinned_clubs %}
  <ul class="divide-y divide-slate-100">
    {% for c in pinned_clubs %}
      <li class="flex items-center justify-between px-4 py-2 hover:bg-slate-50 group">
        <a href="/teams/{{ c.id }}" class="flex-1 min-w-0">
          <div class="text-sm font-medium truncate">{{ c.name }}</div>
          {% if c.area %}<div class="text-xs text-slate-500 truncate">{{ c.area }}</div>{% endif %}
        </a>
        <button
          hx-post="/unpin-team/{{ c.id }}"
          hx-target="#pinned-sidebar"
          hx-swap="innerHTML"
          class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-600 text-xs px-2 transition-opacity"
          title="Unpin"
        >✕</button>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="px-4 py-6 text-xs text-slate-500">
    No clubs pinned yet. Visit any team page and use the pin button.
  </p>
{% endif %}
