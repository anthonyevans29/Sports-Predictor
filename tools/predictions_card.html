<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predictions Card</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7f6f3; --card:#ffffff; --ink:#1a1a18; --muted:#6b6a66;
  --line:#e3e1db; --accent:#0f6b4f; --warn:#a86a00; --bad:#a13333;
  --chip:#eef2ee; --bar:#d8e6df; --barfill:#0f6b4f; --q:#fbe9e9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --card:#1f1f1c; --ink:#ecebe7; --muted:#a2a19c;
    --line:#33322e; --accent:#4dc59a; --warn:#e0a63f; --bad:#e07a7a;
    --chip:#26302a; --bar:#2c3a33; --barfill:#4dc59a; --q:#3a2626;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --card:#1f1f1c; --ink:#ecebe7; --muted:#a2a19c;
  --line:#33322e; --accent:#4dc59a; --warn:#e0a63f; --bad:#e07a7a;
  --chip:#26302a; --bar:#2c3a33; --barfill:#4dc59a; --q:#3a2626;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:14px;max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.filecard{background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px;margin-bottom:12px}
.sporthead{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.sporthead h2{font-size:16px;margin:0}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip)}
.badge.live{background:var(--accent);color:#fff}
.game{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:8px}
.game.quar{border-color:var(--bad);background:linear-gradient(var(--q),var(--card))}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.match{font-weight:600}
.time{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:11px;padding:1px 8px;border-radius:20px;background:var(--chip)}
.chip.strong{background:var(--accent);color:#fff}
.chip.q{background:var(--bad);color:#fff}
.chip.warn{color:var(--warn);border:1px solid var(--warn);background:transparent}
.bars{margin-top:8px;display:grid;gap:4px}
.barrow{display:grid;grid-template-columns:58px 1fr 118px;gap:8px;align-items:center;font-size:12.5px}
.bar{height:9px;background:var(--bar);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--barfill)}
.mkt{color:var(--muted);text-align:right;white-space:nowrap}
.meta{margin-top:7px;color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.gap{color:var(--bad)}
.pos{color:var(--accent)} .neg{color:var(--bad)}
</style>
</head>
<body>
<h1>Predictions Card</h1>
<div class="sub">The daily card for every sport, straight from the export files. Select all of today's prediction JSONs (MLB / soccer / NFL / NHL) — nothing leaves this page.</div>
<div class="filecard">
  <input type="file" id="files" accept=".json" multiple>
</div>
<div id="out"></div>

<script>
"use strict";
const OUTCOMES = {three: ["home_win","draw","away_win"], two: ["home_win","away_win"]};
const KEYMAP = {home_win:"HOME", draw:"DRAW", away_win:"AWAY"};

function rowsFrom(doc){
  const sport = (doc.sport || "?").toUpperCase();
  const live = doc.rehearsal === false;
  const out = [];
  for (const p of (doc.predictions || [])){
    const pr = p.prediction || {};
    let probs = null, three = false;
    if (pr.probabilities && pr.probabilities.draw != null){
      probs = pr.probabilities; three = true;
    } else if (pr.probabilities){
      probs = pr.probabilities;
    } else if (pr.home_win_prob != null){
      probs = {home_win: pr.home_win_prob, away_win: 1 - pr.home_win_prob};
    }
    if (!probs) continue;
    let fair = {};
    const mk = p.market || {};
    if (mk.selections){ for (const [k,v] of Object.entries(mk.selections)) fair[k] = v && v.fair_prob; }
    else if (mk.fair_prob){ fair = {...mk.fair_prob}; }
    const iq = p.input_quality || {};
    const inj = iq.injuries || {};
    const qbs = [].concat((inj.home && inj.home.qb_listed) || [], (inj.away && inj.away.qb_listed) || []);
    out.push({
      sport, live,
      home: p.home_team || "?", away: p.away_team || "?",
      when: (p.utc_date || "").slice(0, 16).replace("T", " "),
      utc: p.utc_date || "",
      tier: pr.tier || null,
      probs, three,
      fair,
      books: mk.bookmaker_count,
      kalshi: iq.kalshi || null,
      over: pr.over_prob != null ? pr.over_prob : null,
      div: p.market_divergence_pp != null ? p.market_divergence_pp : null,
      quar: !!p.quarantine,
      qbs,
      noBooks: !iq.book_odds && !(mk.bookmaker_count > 0),
    });
  }
  return {sport, live, rows: out.sort((a,b)=>a.utc.localeCompare(b.utc))};
}

function pct(x){ return (x*100).toFixed(1) + "%"; }

function render(groups){
  const out = document.getElementById("out");
  out.innerHTML = "";
  for (const g of groups){
    const head = document.createElement("div");
    head.className = "sporthead";
    head.innerHTML = `<h2>${g.sport}</h2>
      <span class="badge ${g.live ? "live" : ""}">${g.live ? "LIVE" : "internal"}</span>
      <span class="badge">${g.rows.length} games</span>`;
    out.appendChild(head);
    for (const r of g.rows){
      const keys = r.three ? OUTCOMES.three : OUTCOMES.two;
      const top = keys.reduce((a,b)=> (r.probs[a]??0) >= (r.probs[b]??0) ? a : b);
      const bars = keys.map(k=>{
        const mp = r.probs[k] ?? 0;
        const f = r.fair[KEYMAP[k]];
        const edge = f != null ? (mp - f) * 100 : null;
        const lbl = {home_win:"Home", draw:"Draw", away_win:"Away"}[k];
        return `<div class="barrow">
          <div>${lbl}${k===top?" ◂":""}</div>
          <div class="bar"><i style="width:${Math.min(100, mp*100)}%"></i></div>
          <div class="mkt">${pct(mp)}${f!=null?` · mkt ${pct(f)} <span class="${edge>=0?"pos":"neg"}">${edge>=0?"+":""}${edge.toFixed(1)}</span>`:""}</div>
        </div>`;
      }).join("");
      const chips = [];
      if (r.tier) chips.push(`<span class="chip ${r.tier==="strong"?"strong":""}">${r.tier}</span>`);
      if (r.quar) chips.push(`<span class="chip q">QUARANTINE ${r.div>=0?"+":""}${r.div}pp</span>`);
      else if (r.div != null && Math.abs(r.div) >= 10) chips.push(`<span class="chip warn">${r.div>=0?"+":""}${r.div}pp vs mkt</span>`);
      if (r.over != null && r.over >= 0.5 && r.over < 0.6) chips.push(`<span class="chip warn">totals 50–60 band</span>`);
      if (r.qbs.length) chips.push(`<span class="chip warn">QB: ${r.qbs.join(", ")}</span>`);
      const meta = [];
      meta.push(r.books ? `${r.books} books` : `<span class="gap">no books</span>`);
      meta.push(r.kalshi ? `kalshi ${r.kalshi}` : `<span class="gap">kalshi —</span>`);
      if (r.over != null) meta.push(`over ${pct(r.over)}`);
      const el = document.createElement("div");
      el.className = "game" + (r.quar ? " quar" : "");
      el.innerHTML = `<div class="top">
          <div><div class="match">${r.away} @ ${r.home}</div>
          <div class="chips">${chips.join("")}</div></div>
          <div class="time">${r.when} UTC</div>
        </div>
        <div class="bars">${bars}</div>
        <div class="meta">${meta.join(" · ")}</div>`;
      out.appendChild(el);
    }
  }
}

document.getElementById("files").addEventListener("change", async e=>{
  const groups = [];
  for (const f of Array.from(e.target.files)){
    try { groups.push(rowsFrom(JSON.parse(await f.text()))); }
    catch(err){ console.error(f.name, err); }
  }
  groups.sort((a,b)=> a.sport.localeCompare(b.sport));
  render(groups.filter(g=>g.rows.length));
});
</script>
</body>
</html>
